[package]
name = "mdmusic"
description = "MDMusic desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mdmusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mdm-decode.workspace = true
mdm-engine.workspace = true
mdm-library.workspace = true
mdm-analyze.workspace = true
base64 = "0.23"
percent-encoding = "2.3"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# The Windows media controls (media keys, overlay, lock screen).
windows = { version = "0.62", features = [
    "Foundation",
    "Media",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_WinRT",
] }
