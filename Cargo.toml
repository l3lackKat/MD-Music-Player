[workspace]
resolver = "2"
members = ["crates/mdm-decode", "crates/mdm-engine", "crates/mdm-library", "src-tauri"]
default-members = ["crates/mdm-decode", "crates/mdm-engine", "crates/mdm-library"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
mdm-decode = { path = "crates/mdm-decode" }
mdm-engine = { path = "crates/mdm-engine" }
mdm-library = { path = "crates/mdm-library" }
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
